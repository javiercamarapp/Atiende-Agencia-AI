# Configuracion de gitleaks (PL-11). Hereda TODAS las reglas por defecto de gitleaks.
# Repo publico: cualquier secreto real que llegue al historial queda expuesto, asi que el
# escaneo corre en cada PR y push a main (.github/workflows/secret-scan.yml) sobre el
# historial completo, no solo sobre el diff.
title = "Atiende - gitleaks"

[extend]
useDefault = true

# Falsos positivos medidos el 30-sep-2026 sobre el historial completo (1345 commits): 17 hallazgos,
# TODOS en archivos de prueba y TODOS valores de relleno obvios (por ejemplo "sk_live_ABCDEFGHIJKLMNOP1234"
# como cadena que el test de redaccion de PII debe ocultar, "9137-PRIVADO", contrasenas de fixtures).
# La excepcion es deliberadamente estrecha: solo dos reglas de heuristica generica (`generic-api-key`,
# `stripe-access-token`) y solo bajo directorios `tests/`. Las demas reglas (llaves privadas, AWS, GitHub,
# Slack, etc.) siguen activas tambien dentro de tests/, y estas dos siguen activas en todo el codigo de produccion.
[[allowlists]]
description = "Valores de relleno en fixtures de prueba (heuristica generica y patron sk_live_ ficticio)"
targetRules = ["generic-api-key", "stripe-access-token"]
paths = [
  '''(^|/)tests?/''',
]

# Fixture del test de redaccion del respaldo (scripts/respaldo/tests): trae un JWT y una llave `AGE-SECRET-KEY-1QQQ`
# truncada A PROPOSITO, para comprobar que `redact()` los oculta. Regla `jwt` acotada a ese directorio.
[[allowlists]]
description = "Cadenas de relleno del test de redaccion del respaldo (JWT de juguete)"
targetRules = ["jwt"]
paths = [
  '''(^|/)scripts/respaldo/tests/''',
]

# assertions.sql del verify del volumen de la demo (R-20): archivo GENERADO (generar-assertions.ts) que embebe lotes de pedidos
# sinteticos. Cada pedido lleva `"idempotencyKey":"<sha256 hex>"`, el hash de su clave de deduplicacion: son 64 caracteres
# hexadecimales de alta entropia que la heuristica generica confunde con una llave de API, pero NO son un secreto (derivan de la
# organizacion de prueba y de un contador). Excepcion deliberadamente estrecha: una sola regla heuristica y un solo archivo.
[[allowlists]]
description = "Hashes sha256 de claves de idempotencia de pedidos sinteticos en el assertions.sql generado del verify de volumen"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)scripts/verify-restaurantes-demo-volumen/assertions\.sql$''',
]
