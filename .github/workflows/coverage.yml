name: Cobertura (informativo)

# PL-11. Corre `npm run test:coverage` (la misma suite que test:unit, instrumentada con v8) y publica el
# resumen en el job y el reporte lcov/json como artefacto. Es un workflow APARTE de ci-checks.yml a
# proposito: la cobertura duplica el costo de la suite, y asi ci-checks.yml (typecheck + lint + tests +
# build) sigue siendo rapido y es el que debe pedirse como check obligatorio. Este SI falla si baja del
# umbral (trinquete anti-regresion) configurado en vitest.config.ts::coverage.thresholds; ver docs/COBERTURA.md.
# Sin secretos, sin despliegue, contents: read, sin pull_request_target.
#
# Cuando corre (desaturar Actions, nov-2026): YA NO en cada push de PR. Era ~18% de los minutos de Actions
# (doble costo de la suite por push, en ~35 PRs abiertos) y con la cola llena chocaba con el timeout de 40 min.
# Ahora: cada push a main (el trinquete del umbral sigue protegiendo main: el commit que lo baje queda en rojo
# en main), una corrida nocturna y manual (workflow_dispatch, tambien sobre la rama de un PR si se quiere el
# numero antes de fusionar). El umbral NO cambia. No es un check requerido de PR.
on:
  push:
    branches: [main]
  schedule:
    # 07:23 UTC = 01:23 en Merida; fuera del pico de la cola.
    - cron: "23 7 * * *"
  workflow_dispatch: {}

# En main NO se cancela la corrida en curso (cada commit conserva su veredicto); GitHub si colapsa las
# corridas PENDIENTES del mismo grupo, asi que con varios merges seguidos queda una en curso + la ultima.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage:
    name: test:coverage (v8) + umbral
    runs-on: ubuntu-latest
    # La suite sin instrumentar ya tarda ~24-25 min en un solo job (por eso test:unit va en 3 shards); con v8
    # pasaba de 40 min y se cancelaba sin veredicto. 75 min de margen. No se parte en shards: el umbral se
    # evalua sobre la cobertura TOTAL, y fuera del camino de los PRs el tiempo de reloj ya no bloquea a nadie.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22 + npm ci, o node_modules restaurado del cache de main (ver .github/actions/node-deps).
      - name: Node + dependencias
        uses: ./.github/actions/node-deps

      - name: Tests con cobertura (falla si baja del umbral)
        run: npm run test:coverage

      - name: Resumen en el job
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json","utf8")).total;
              const f = (k) => `${t[k].pct}% (${t[k].covered}/${t[k].total})`;
              console.log(`### Cobertura total\n\n| Metrica | Valor |\n|---|---|\n| Lineas | ${f("lines")} |\n| Sentencias | ${f("statements")} |\n| Ramas | ${f("branches")} |\n| Funciones | ${f("functions")} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
