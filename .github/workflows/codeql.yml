name: CodeQL

# PL-12. Analisis estatico de seguridad (CodeQL) para JavaScript/TypeScript, en cada PR, en cada push a main y
# una vez por semana (los conjuntos de consultas de CodeQL se actualizan aunque el codigo no cambie).
#
# Seguridad del workflow:
# - Disparadores: pull_request (NO pull_request_target), push a main, schedule y manual. El codigo del PR se
#   analiza pero nunca se ejecuta con secretos: no hay secretos en este workflow.
# - permissions: contents: read por defecto; solo el job de analisis agrega security-events: write (necesario
#   para subir resultados). En un PR desde un fork GitHub entrega un token de solo lectura: el analisis corre
#   y la subida de resultados se omite, sin romper el check.
# - Sin despliegue, sin Vercel, sin Supabase. Gratis en repo publico.
# - build-mode: none (JavaScript/TypeScript no se compila para el analisis).
# - Si alguna vez se activa el "default setup" de code scanning desde la UI de GitHub, desactivar este workflow
#   o el default setup: usar los dos a la vez duplica el analisis y GitHub rechaza la subida.
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    # Lunes 09:17 UTC (hora poco comun para no coincidir con el pico de la cola de Actions).
    - cron: "17 9 * * 1"
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
