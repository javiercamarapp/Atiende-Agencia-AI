name: Postgres real (gate)

# Qué es esto y por qué existe
# ------------------------------------------------------------------------------
# Auditoría final de 20 rubros (fable-5.1) sobre atiende-fusion, rubros 9 y 20:
# el 0% de la suite de tests (4089+ specs) ejercita Postgres real — TODO corre
# contra el repositorio en memoria de cada domain-<vertical>, que nunca aplica
# RLS ni GRANT. `scripts/verify-outbox-grants/` y `scripts/verify-rentas-cron-rls/`
# ya demostraban (a mano) que levantar un Postgres efímero real, aplicar las
# migraciones reales de supabase/migrations/, y correr las aserciones de RLS/GRANT
# ahí es barato y funciona — pero eran scripts que un humano/agente corría
# puntualmente, nunca un gate de CI. Este workflow institucionaliza eso: cualquier
# push/PR que rompa un GRANT o una policy RLS ya cubierta por un scripts/verify-*/
# falla el build automáticamente, sin que nadie tenga que acordarse de correr el
# script a mano ni leer su salida para juzgar si "se ve bien".
#
# Qué SÍ cubre
# ------------------------------------------------------------------------------
# - Levanta un Postgres real (servicio `postgres:16` de GitHub Actions — no se
#   instala nada a mano, GitHub ya lo trae listo).
# - Aplica, en orden, las migraciones REALES de supabase/migrations/ (el mismo
#   set que se aplicaría a un proyecto Supabase real).
# - Corre scripts/verify-real-postgres-ci/run-gate.mjs, que aplica el mock mínimo
#   de plataforma (bootstrap.sql) + el GRANT de schema que en Supabase real pone
#   la plataforma (post-migrations.sql), y luego ejecuta CADA escenario de CADA
#   scripts/verify-*/assertions.sql como su propia verificación automática
#   pass/fail (no una lectura humana de la salida de psql) — ver el comentario de
#   cabecera de ese script para el detalle exacto de cómo deriva el resultado
#   esperado de cada escenario a partir de las convenciones que el propio
#   assertions.sql ya usaba.
# - Es auto-descubrible: cualquier scripts/verify-<algo>/ nuevo que tenga
#   bootstrap.sql + post-migrations.sql + assertions.sql queda cubierto por este
#   mismo job sin tener que editar este archivo.
# - Hoy cubre exactamente lo mismo que los dos scripts existentes:
#     * scripts/verify-outbox-grants/  — GRANT EXECUTE + autorización interna de
#       enqueue/claim/complete del email outbox (6 verticales) y
#       organization_notification_recipients (despachos/licitaciones).
#     * scripts/verify-rentas-cron-rls/ — el escape hatch de sesión-de-sistema en
#       las policies RLS que tocan checkout-sweep-cron / ical-sync-cron /
#       checkin-recordatorio / ical-feed-publico de rentas.
# - ANTES de instalar psql/esperar a Postgres, corre
#   `npm run verify:migration-versions` (scripts/verify-migration-versions/) — el
#   guard agregado tras el bug real de #119/#120 (dos archivos de
#   supabase/migrations/ con el mismo prefijo de timestamp, colado a `main` sin
#   detectarse a mano). Aplicar cada .sql con `psql -f` uno por uno (como hace
#   run-gate.mjs abajo) NUNCA detecta esa colisión por sí solo — `psql` no tiene
#   noción de "version", a diferencia de la CLI real de Supabase
#   (`supabase db push`, que sí usa ese prefijo como llave primaria de
#   `supabase_migrations.schema_migrations` y fallaría/ignoraría uno de los dos
#   en un proyecto real). Este paso falla rápido y barato, antes de gastar el
#   tiempo de levantar Postgres y aplicar 100+ migraciones reales.
#
# Qué NO cubre (fuera de alcance de este cambio puntual — ver
# scripts/verify-real-postgres-ci/README.md para el detalle)
# ------------------------------------------------------------------------------
# - NO corre `npm run typecheck` / `npm run lint` / `npm run test:unit` / build
#   de apps/web — ese tier (repositorio en memoria) corre en su propio
#   workflow, .github/workflows/ci-checks.yml (agregado 19-sep-2026), en
#   pull_request/push a main igual que este job, pero NO con los mismos
#   triggers: ci-checks.yml tiene exclusiones de `paths` (no dispara para un
#   diff que solo toca docs/**/*.md fuera de docs/DEPLOY.md y
#   supabase/migrations/README.md) que este workflow no tiene. Deliberadamente
#   separado de este job para no encadenar typecheck/lint/tests detrás de
#   instalar Postgres real + aplicar 100+ migraciones.
# - NO ejercita ninguna tabla/función/policy de las 6 verticales que no esté ya
#   cubierta por un scripts/verify-*/assertions.sql existente — esto NO es un
#   test de regresión general de todo el esquema, es exactamente el alcance que
#   cada assertions.sql documenta en su propio README.
# - NO hace build ni deploy de nada (Vercel u otro): este workflow es
#   exclusivamente de tests, no tiene ningún paso de publicación.
#
# Segundo job — fallback-savepoint-gate (agregado en la corrección de
# runWithSavepointFallback, auditoría a1)
# ------------------------------------------------------------------------------
# scripts/verify-fallback-savepoint/ NO cabe en el contrato genérico de arriba
# (necesita ver un COMMIT real y aplicar las migraciones SALTÁNDOSE una a
# propósito) — corre como un job APARTE, con su propio Postgres efímero vía
# initdb (mismo patrón que scripts/verify-caller-binding-fase3/run.sh), nunca vía
# el servicio `postgres:` ni `run-gate.mjs`. Ver scripts/verify-fallback-savepoint/
# README.md para el detalle completo de qué demuestra y por qué.
#
# Filtro por rutas y borradores (desaturar Actions, nov-2026)
# ------------------------------------------------------------------------------
# En push a main y en workflow_dispatch corren TODOS los gates, siempre. En pull_request, el job `cambios`
# lee la lista de archivos del PR (API de GitHub) y cada gate corre solo si el PR toca algo que ese gate
# puede ver (tabla en el job `cambios`). Un PR que solo toca apps/web, packages/ui o docs ya no levanta
# Postgres. En PR en borrador no corre ningun gate pesado; al marcarlo como listo (ready_for_review) el
# workflow vuelve a correr completo. El check `Migraciones reales + assertions RLS/GRANT contra Postgres real`
# corre SIEMPRE y es el que se pide como requerido: pasa si cada gate que debia correr termino en success y
# cada gate omitido lo fue por el filtro; cualquier otro resultado (fallo, cancelado) lo deja en rojo. Si la
# API no responde, el filtro falla hacia el lado seguro: corre todo.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

# Un push nuevo al mismo PR cancela el gate anterior de ese PR (cada update-branch/push lo
# reiniciaba y acumulaba corridas de ~50 min). El grupo incluye el workflow y el número de PR,
# así que PRs distintos nunca se cancelan entre sí. En push a main NO se cancela: cada commit
# de main conserva su propio veredicto (mismo criterio que ci-checks.yml). workflow_dispatch
# agrupa por ref y tampoco cancela.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Sharding del gate (ver .github/workflows/README.md, sección postgres-real-gate.yml, con la medición):
# el job único aplicaba bootstrap.sql + ~300 migraciones UNA VEZ POR CARPETA (~16 s de ~18 s cada una) para
# ~170 carpetas en serie (~3.100 s). Ahora:
#   - run-gate.mjs construye una base plantilla por bootstrap.sql distinto y clona cada carpeta de ella.
#   - `postgres-real-gate-shard` reparte las carpetas en 6 shards en paralelo (`--shard i/6`).
#   - `postgres-real-gate` es el agregador que CONSERVA el nombre histórico del check: pasa solo si los 6
#     shards pasaron Y si los reportes de los shards cubren EXACTAMENTE las carpetas descubiertas.
jobs:
  # Decide que gates corren. Salidas ("true"/"false"):
  #   base         -> shards RLS/GRANT y SAVEPOINT. Y fuerza TODOS los demas. Rutas: package.json,
  #                   package-lock.json, este workflow, .github/actions/, supabase/, packages/*/migrations/,
  #                   packages/db/, scripts/verify-*/ y scripts/eval-copiloto/ (los run.sh se leen archivos
  #                   entre carpetas verify-*, asi que cualquier cambio ahi corre todo).
  #   citas        -> base o packages/domain-citas/ (citas-concurrencia, solo SQL).
  #   licitaciones -> base o packages/domain-licitaciones/ (datos-empresa y step-up, solo SQL).
  #   restaurantes -> base o packages/domain-restaurantes/ (restaurantes-whatsapp-concurrencia, solo SQL).
  #   backend      -> base o cualquier codigo de servidor: apps/api, apps/worker, apps/voice-worker,
  #                   packages/** salvo packages/ui, tsconfig*.json, vitest*.ts, test-setup/ (gates que
  #                   ejecutan codigo TS real: whatsapp-concurrencia, preview de agente/voz, eval del
  #                   Copiloto y rentas-concurrencia; importan apps/api y varios packages).
  cambios:
    name: Gates de Postgres que aplican a este cambio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      borrador: ${{ steps.f.outputs.borrador }}
      base: ${{ steps.f.outputs.base }}
      citas: ${{ steps.f.outputs.citas }}
      licitaciones: ${{ steps.f.outputs.licitaciones }}
      restaurantes: ${{ steps.f.outputs.restaurantes }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - name: Archivos del PR -> gates
        id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BORRADOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CAMBIADOS: ${{ github.event.pull_request.changed_files || 0 }}
        run: |
          set -uo pipefail
          SALIDAS="base citas licitaciones restaurantes backend"
          todos() { for k in $SALIDAS; do echo "$k=$1" >> "$GITHUB_OUTPUT"; done; echo "todos los gates=$1"; }
          echo "borrador=$BORRADOR" >> "$GITHUB_OUTPUT"
          if [ "$EVENTO" != "pull_request" ]; then
            echo "Evento $EVENTO: corren todos los gates"; todos true; exit 0
          fi
          if [ "$BORRADOR" = "true" ]; then
            echo "::notice::PR en borrador: los gates de Postgres corren al marcarlo como listo para revision"
            todos false; exit 0
          fi
          lista="$RUNNER_TEMP/archivos.txt"
          if ! gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$lista"; then
            echo "::warning::No pude leer los archivos del PR: corren todos los gates"; todos true; exit 0
          fi
          # La API devuelve como maximo 3000 archivos; con mas (o con una lista vacia) no se filtra.
          if [ "$CAMBIADOS" -ge 3000 ] || [ ! -s "$lista" ]; then
            echo "Lista de archivos incompleta o vacia: corren todos los gates"; todos true; exit 0
          fi
          echo "Archivos del PR: $(wc -l < "$lista")"
          BASE='^(package\.json|package-lock\.json|\.github/workflows/postgres-real-gate\.yml|\.github/actions/|supabase/|packages/[^/]+/migrations/|packages/db/|scripts/verify-|scripts/eval-copiloto/)'
          BACKEND='^(apps/(api|worker|voice-worker)/|packages/|tsconfig[^/]*\.json$|vitest[^/]*\.ts$|test-setup/)'
          base=false; grep -qE "$BASE" "$lista" && base=true
          decide() {
            local v=$base
            if [ "$v" != true ] && "${@:2}"; then v=true; fi
            echo "$1=$v" >> "$GITHUB_OUTPUT"; echo "$1=$v"
          }
          toca() { grep -qE "$1" "$lista"; }
          # Sin `grep -q` al final del tubo: con pipefail, el SIGPIPE del primer grep daria un falso "no".
          toca_backend() { [ -n "$(grep -E "$BACKEND" "$lista" | grep -vE '^packages/ui/')" ]; }
          decide base false
          decide citas toca '^packages/domain-citas/'
          decide licitaciones toca '^packages/domain-licitaciones/'
          decide restaurantes toca '^packages/domain-restaurantes/'
          decide backend toca_backend

  # Ola 4 (G3): una migracion AGREGADA con version menor que otra ya existente que redefine la
  # misma funcion se aplicaria DESPUES en produccion (db push aplica las faltantes al llegar) y
  # revertiria la funcion; el gate de abajo aplica por version y no lo ve. Necesita historial
  # (fetch-depth: 0) para calcular las migraciones agregadas contra la base del PR. Solo Node.
  orden-redefiniciones:
    name: Redefiniciones de funcion fuera de orden
    needs: cambios
    if: needs.cambios.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (con historial)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Guard (scripts/verify-orden-redefiniciones)
        run: npm run verify:orden-redefiniciones

  postgres-real-gate-shard:
    name: Gate Postgres real (shard ${{ matrix.shard }}/6)
    needs: cambios
    if: needs.cambios.outputs.base == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 + npm ci, o node_modules restaurado del cache de main (ver .github/actions/node-deps).
      - name: Node + dependencias
        uses: ./.github/actions/node-deps

      - name: Guard de prefijos de versión duplicados en supabase/migrations (scripts/verify-migration-versions)
        run: npm run verify:migration-versions

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: Migraciones reales + gate de assertions RLS/GRANT (shard ${{ matrix.shard }}/6 de scripts/verify-*/)
        run: node scripts/verify-real-postgres-ci/run-gate.mjs --shard ${{ matrix.shard }}/6 --report "$RUNNER_TEMP/shard-report.json"

      # Se sube aunque el paso anterior falle: el agregador necesita el reporte de CADA shard para demostrar la cobertura.
      - name: Subir reporte del shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-gate-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-report.json
          if-no-files-found: warn
          retention-days: 3

  # Conserva el nombre histórico del check y corre SIEMPRE (if: always()), para que una regla de check
  # requerido nunca se quede esperando. Desde el filtro por rutas es el veredicto de TODOS los gates de este
  # workflow (antes solo de los shards): cada gate que `cambios` marco debe terminar en success, y cada gate
  # que `cambios` no marco debe quedar "skipped". Un fallo, una cancelacion o un `cambios` roto -> rojo.
  postgres-real-gate:
    name: Migraciones reales + assertions RLS/GRANT contra Postgres real
    needs:
      - cambios
      - postgres-real-gate-shard
      - fallback-savepoint-gate
      - whatsapp-concurrencia-gate
      - restaurantes-agente-preview-pg-real-gate
      - citas-concurrencia-gate
      - datos-empresa-concurrencia-gate
      - stepup-concurrencia-gate
      - restaurantes-whatsapp-concurrencia-gate
      - eval-copiloto-congelado
      - rentas-concurrencia-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Veredicto de los gates
        env:
          CAMBIOS: ${{ needs.cambios.result }}
          BORRADOR: ${{ needs.cambios.outputs.borrador }}
          E_BASE: ${{ needs.cambios.outputs.base }}
          E_CITAS: ${{ needs.cambios.outputs.citas }}
          E_LICITACIONES: ${{ needs.cambios.outputs.licitaciones }}
          E_RESTAURANTES: ${{ needs.cambios.outputs.restaurantes }}
          E_BACKEND: ${{ needs.cambios.outputs.backend }}
          R_SHARDS: ${{ needs.postgres-real-gate-shard.result }}
          R_SAVEPOINT: ${{ needs.fallback-savepoint-gate.result }}
          R_WA: ${{ needs.whatsapp-concurrencia-gate.result }}
          R_PREVIEW: ${{ needs.restaurantes-agente-preview-pg-real-gate.result }}
          R_CITAS: ${{ needs.citas-concurrencia-gate.result }}
          R_DATOS_EMPRESA: ${{ needs.datos-empresa-concurrencia-gate.result }}
          R_STEPUP: ${{ needs.stepup-concurrencia-gate.result }}
          R_REST_WA: ${{ needs.restaurantes-whatsapp-concurrencia-gate.result }}
          R_COPILOTO: ${{ needs.eval-copiloto-congelado.result }}
          R_RENTAS: ${{ needs.rentas-concurrencia-gate.result }}
        run: |
          if [ "$CAMBIOS" != "success" ]; then
            echo "::error::El job cambios no terminó en success ($CAMBIOS): no hay veredicto confiable"
            exit 1
          fi
          fallo=0
          revisar() {
            # $1 nombre, $2 debia correr (true/false), $3 resultado del job
            if [ "$2" = "true" ]; then
              [ "$3" = "success" ] || { echo "::error::$1 debia correr y terminó en $3"; fallo=1; }
            else
              [ "$3" = "skipped" ] || { echo "::error::$1 no debia correr y terminó en $3"; fallo=1; }
            fi
            echo "$1: debia_correr=$2 resultado=$3"
          }
          revisar "shards RLS/GRANT" "$E_BASE" "$R_SHARDS"
          revisar "fallback-savepoint" "$E_BASE" "$R_SAVEPOINT"
          revisar "whatsapp-concurrencia" "$E_BACKEND" "$R_WA"
          revisar "restaurantes-agente-preview" "$E_BACKEND" "$R_PREVIEW"
          revisar "citas-concurrencia" "$E_CITAS" "$R_CITAS"
          revisar "datos-empresa-concurrencia" "$E_LICITACIONES" "$R_DATOS_EMPRESA"
          revisar "stepup-concurrencia" "$E_LICITACIONES" "$R_STEPUP"
          revisar "restaurantes-whatsapp-concurrencia" "$E_RESTAURANTES" "$R_REST_WA"
          revisar "eval-copiloto" "$E_BACKEND" "$R_COPILOTO"
          revisar "rentas-concurrencia" "$E_BACKEND" "$R_RENTAS"
          if [ "$BORRADOR" = "true" ]; then
            echo "::notice::PR en borrador: gates omitidos; corren al marcarlo como listo para revision"
          fi
          exit $fallo

      - name: Checkout
        if: needs.cambios.outputs.base == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: needs.cambios.outputs.base == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Descargar reportes de los shards
        if: needs.cambios.outputs.base == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: postgres-gate-report-*
          path: ${{ runner.temp }}/reportes

      # Cobertura idéntica: la unión de lo EJECUTADO por los 6 shards debe ser exactamente lo que descubre
      # run-gate.mjs (cada scripts/verify-*/ con los 3 archivos, una sola vez), con los 6 reportes presentes.
      - name: Cobertura exacta (reportes de shards == carpetas descubiertas)
        if: needs.cambios.outputs.base == 'true'
        run: node scripts/verify-real-postgres-ci/run-gate.mjs --verify-reports "$RUNNER_TEMP/reportes"

  fallback-savepoint-gate:
    name: SAVEPOINT real para fallback por SQLSTATE (scripts/verify-fallback-savepoint)
    needs: cambios
    if: needs.cambios.outputs.base == 'true'
    runs-on: ubuntu-latest
    # Job APARTE, sin el servicio `postgres:` de arriba: scripts/verify-fallback-
    # savepoint/run.sh levanta su PROPIO Postgres efímero vía initdb (mismo patrón
    # que scripts/verify-caller-binding-fase3/run.sh) porque necesita aplicar
    # supabase/migrations/*.sql SALTÁNDOSE una a propósito (la 019, para reproducir
    # la base SIN esa migración) y ver el tag de comando de un COMMIT real —
    # ninguna de las dos cosas es posible con el runner genérico
    # scripts/verify-real-postgres-ci/run-gate.mjs que usa el job de arriba (ver
    # scripts/verify-fallback-savepoint/README.md para el detalle completo).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar initdb/pg_ctl/psql disponibles
        run: |
          if ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          # El paquete `postgresql` de Ubuntu/Debian NO pone initdb/pg_ctl en PATH
          # (viven en /usr/lib/postgresql/<version>/bin/, solo psql/pg_config
          # quedan en PATH vía los wrappers pg_wrapper) -- a diferencia de Homebrew
          # en macOS, donde `verify-caller-binding-fase3/run.sh` y este mismo
          # script ya corren tal cual localmente. Se agrega a GITHUB_PATH (no solo
          # a este step) para que el siguiente step también los vea.
          if ! command -v initdb >/dev/null 2>&1; then
            # /usr/lib/postgresql/<version>/bin/initdb -- 3 niveles bajo
            # /usr/lib/postgresql (<version>/bin/initdb), no 2 (esa profundidad
            # es el directorio bin/, no el binario).
            PG_BIN="$(dirname "$(find /usr/lib/postgresql -maxdepth 3 -name initdb -print -quit)")"
            if [ -z "$PG_BIN" ] || [ "$PG_BIN" = "." ]; then
              echo "verify-fallback-savepoint (CI): no se encontró initdb bajo /usr/lib/postgresql tras instalar el paquete postgresql -- ¿cambió el layout del paquete?" >&2
              find /usr/lib/postgresql -maxdepth 3 >&2 || true
              exit 1
            fi
            echo "$PG_BIN" >> "$GITHUB_PATH"
            export PATH="$PG_BIN:$PATH"
          fi
          initdb --version
          pg_ctl --version
          psql --version

      - name: scripts/verify-fallback-savepoint/run.sh
        run: bash scripts/verify-fallback-savepoint/run.sh

  whatsapp-concurrencia-gate:
    name: Webhook de WhatsApp con mensajes simultaneos (scripts/verify-whatsapp-concurrencia)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Job APARTE: levanta su PROPIO Postgres efimero via initdb CON TLS (el motor de produccion exige TLS, y el servicio `postgres:`
    # de arriba no lo trae), aplica las migraciones reales y corre la API real de produccion con OpenRouter y Meta simulados.
    # Falla si 6+ mensajes simultaneos al webhook de restaurantes dejan de responder 200 o si se pierde/duplica un mensaje (P0
    # de la cuenta real de PM: interbloqueo del pool de conexiones). Ver scripts/verify-whatsapp-concurrencia/README.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 + npm ci, o node_modules restaurado del cache de main (ver .github/actions/node-deps).
      - name: Node + dependencias
        uses: ./.github/actions/node-deps

      - name: Confirmar initdb/pg_ctl/psql disponibles
        run: |
          if ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          # El paquete `postgresql` de Ubuntu/Debian deja initdb/pg_ctl fuera de PATH (ver el job fallback-savepoint-gate).
          if ! command -v initdb >/dev/null 2>&1; then
            PG_BIN="$(dirname "$(find /usr/lib/postgresql -maxdepth 3 -name initdb -print -quit)")"
            if [ -z "$PG_BIN" ] || [ "$PG_BIN" = "." ]; then
              echo "verify-whatsapp-concurrencia (CI): no se encontro initdb bajo /usr/lib/postgresql" >&2
              exit 1
            fi
            echo "$PG_BIN" >> "$GITHUB_PATH"
            export PATH="$PG_BIN:$PATH"
          fi
          initdb --version
          pg_ctl --version
          psql --version

      - name: scripts/verify-whatsapp-concurrencia/run.sh
        run: bash scripts/verify-whatsapp-concurrencia/run.sh

