name: Postgres real (gate)

# Qué es esto y por qué existe
# ------------------------------------------------------------------------------
# Auditoría final de 20 rubros (fable-5.1) sobre atiende-fusion, rubros 9 y 20:
# el 0% de la suite de tests (4089+ specs) ejercita Postgres real — TODO corre
# contra el repositorio en memoria de cada domain-<vertical>, que nunca aplica
# RLS ni GRANT. `scripts/verify-outbox-grants/` y `scripts/verify-rentas-cron-rls/`
# ya demostraban (a mano) que levantar un Postgres efímero real, aplicar las
# migraciones reales de supabase/migrations/, y correr las aserciones de RLS/GRANT
# ahí es barato y funciona — pero eran scripts que un humano/agente corría
# puntualmente, nunca un gate de CI. Este workflow institucionaliza eso: cualquier
# push/PR que rompa un GRANT o una policy RLS ya cubierta por un scripts/verify-*/
# falla el build automáticamente, sin que nadie tenga que acordarse de correr el
# script a mano ni leer su salida para juzgar si "se ve bien".
#
# Qué SÍ cubre
# ------------------------------------------------------------------------------
# - Levanta un Postgres real (servicio `postgres:16` de GitHub Actions — no se
#   instala nada a mano, GitHub ya lo trae listo).
# - Aplica, en orden, las migraciones REALES de supabase/migrations/ (el mismo
#   set que se aplicaría a un proyecto Supabase real).
# - Corre scripts/verify-real-postgres-ci/run-gate.mjs, que aplica el mock mínimo
#   de plataforma (bootstrap.sql) + el GRANT de schema que en Supabase real pone
#   la plataforma (post-migrations.sql), y luego ejecuta CADA escenario de CADA
#   scripts/verify-*/assertions.sql como su propia verificación automática
#   pass/fail (no una lectura humana de la salida de psql) — ver el comentario de
#   cabecera de ese script para el detalle exacto de cómo deriva el resultado
#   esperado de cada escenario a partir de las convenciones que el propio
#   assertions.sql ya usaba.
# - Es auto-descubrible: cualquier scripts/verify-<algo>/ nuevo que tenga
#   bootstrap.sql + post-migrations.sql + assertions.sql queda cubierto por este
#   mismo job sin tener que editar este archivo.
# - Hoy cubre exactamente lo mismo que los dos scripts existentes:
#     * scripts/verify-outbox-grants/  — GRANT EXECUTE + autorización interna de
#       enqueue/claim/complete del email outbox (6 verticales) y
#       organization_notification_recipients (despachos/licitaciones).
#     * scripts/verify-rentas-cron-rls/ — el escape hatch de sesión-de-sistema en
#       las policies RLS que tocan checkout-sweep-cron / ical-sync-cron /
#       checkin-recordatorio / ical-feed-publico de rentas.
# - ANTES de instalar psql/esperar a Postgres, corre
#   `npm run verify:migration-versions` (scripts/verify-migration-versions/) — el
#   guard agregado tras el bug real de #119/#120 (dos archivos de
#   supabase/migrations/ con el mismo prefijo de timestamp, colado a `main` sin
#   detectarse a mano). Aplicar cada .sql con `psql -f` uno por uno (como hace
#   run-gate.mjs abajo) NUNCA detecta esa colisión por sí solo — `psql` no tiene
#   noción de "version", a diferencia de la CLI real de Supabase
#   (`supabase db push`, que sí usa ese prefijo como llave primaria de
#   `supabase_migrations.schema_migrations` y fallaría/ignoraría uno de los dos
#   en un proyecto real). Este paso falla rápido y barato, antes de gastar el
#   tiempo de levantar Postgres y aplicar 100+ migraciones reales.
#
# Qué NO cubre (fuera de alcance de este cambio puntual — ver
# scripts/verify-real-postgres-ci/README.md para el detalle)
# ------------------------------------------------------------------------------
# - NO corre `npm run typecheck` / `npm run lint` / `npm run test:unit` / build
#   de apps/web — ese tier (repositorio en memoria) corre en su propio
#   workflow, .github/workflows/ci-checks.yml (agregado 19-sep-2026), en
#   pull_request/push a main igual que este job, pero NO con los mismos
#   triggers: ci-checks.yml tiene exclusiones de `paths` (no dispara para un
#   diff que solo toca docs/**/*.md fuera de docs/DEPLOY.md y
#   supabase/migrations/README.md) que este workflow no tiene. Deliberadamente
#   separado de este job para no encadenar typecheck/lint/tests detrás de
#   instalar Postgres real + aplicar 100+ migraciones.
# - NO ejercita ninguna tabla/función/policy de las 6 verticales que no esté ya
#   cubierta por un scripts/verify-*/assertions.sql existente — esto NO es un
#   test de regresión general de todo el esquema, es exactamente el alcance que
#   cada assertions.sql documenta en su propio README.
# - NO hace build ni deploy de nada (Vercel u otro): este workflow es
#   exclusivamente de tests, no tiene ningún paso de publicación.
#
# Segundo job — fallback-savepoint-gate (agregado en la corrección de
# runWithSavepointFallback, auditoría a1)
# ------------------------------------------------------------------------------
# scripts/verify-fallback-savepoint/ NO cabe en el contrato genérico de arriba
# (necesita ver un COMMIT real y aplicar las migraciones SALTÁNDOSE una a
# propósito) — corre como un job APARTE, con su propio Postgres efímero vía
# initdb (mismo patrón que scripts/verify-caller-binding-fase3/run.sh), nunca vía
# el servicio `postgres:` ni `run-gate.mjs`. Ver scripts/verify-fallback-savepoint/
# README.md para el detalle completo de qué demuestra y por qué.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  postgres-real-gate:
    name: Migraciones reales + assertions RLS/GRANT contra Postgres real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: npm ci
        run: npm ci

      - name: Guard de prefijos de versión duplicados en supabase/migrations (scripts/verify-migration-versions)
        run: npm run verify:migration-versions

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: Migraciones reales + gate de assertions RLS/GRANT (todos los scripts/verify-*/)
        run: node scripts/verify-real-postgres-ci/run-gate.mjs

  fallback-savepoint-gate:
    name: SAVEPOINT real para fallback por SQLSTATE (scripts/verify-fallback-savepoint)
    runs-on: ubuntu-latest
    # Job APARTE, sin el servicio `postgres:` de arriba: scripts/verify-fallback-
    # savepoint/run.sh levanta su PROPIO Postgres efímero vía initdb (mismo patrón
    # que scripts/verify-caller-binding-fase3/run.sh) porque necesita aplicar
    # supabase/migrations/*.sql SALTÁNDOSE una a propósito (la 019, para reproducir
    # la base SIN esa migración) y ver el tag de comando de un COMMIT real —
    # ninguna de las dos cosas es posible con el runner genérico
    # scripts/verify-real-postgres-ci/run-gate.mjs que usa el job de arriba (ver
    # scripts/verify-fallback-savepoint/README.md para el detalle completo).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar initdb/pg_ctl/psql disponibles
        run: |
          if ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          # El paquete `postgresql` de Ubuntu/Debian NO pone initdb/pg_ctl en PATH
          # (viven en /usr/lib/postgresql/<version>/bin/, solo psql/pg_config
          # quedan en PATH vía los wrappers pg_wrapper) -- a diferencia de Homebrew
          # en macOS, donde `verify-caller-binding-fase3/run.sh` y este mismo
          # script ya corren tal cual localmente. Se agrega a GITHUB_PATH (no solo
          # a este step) para que el siguiente step también los vea.
          if ! command -v initdb >/dev/null 2>&1; then
            # /usr/lib/postgresql/<version>/bin/initdb -- 3 niveles bajo
            # /usr/lib/postgresql (<version>/bin/initdb), no 2 (esa profundidad
            # es el directorio bin/, no el binario).
            PG_BIN="$(dirname "$(find /usr/lib/postgresql -maxdepth 3 -name initdb -print -quit)")"
            if [ -z "$PG_BIN" ] || [ "$PG_BIN" = "." ]; then
              echo "verify-fallback-savepoint (CI): no se encontró initdb bajo /usr/lib/postgresql tras instalar el paquete postgresql -- ¿cambió el layout del paquete?" >&2
              find /usr/lib/postgresql -maxdepth 3 >&2 || true
              exit 1
            fi
            echo "$PG_BIN" >> "$GITHUB_PATH"
            export PATH="$PG_BIN:$PATH"
          fi
          initdb --version
          pg_ctl --version
          psql --version

      - name: scripts/verify-fallback-savepoint/run.sh
        run: bash scripts/verify-fallback-savepoint/run.sh

  whatsapp-concurrencia-gate:
    name: Webhook de WhatsApp con mensajes simultaneos (scripts/verify-whatsapp-concurrencia)
    runs-on: ubuntu-latest
    # Job APARTE: levanta su PROPIO Postgres efimero via initdb CON TLS (el motor de produccion exige TLS, y el servicio `postgres:`
    # de arriba no lo trae), aplica las migraciones reales y corre la API real de produccion con OpenRouter y Meta simulados.
    # Falla si 6+ mensajes simultaneos al webhook de restaurantes dejan de responder 200 o si se pierde/duplica un mensaje (P0
    # de la cuenta real de PM: interbloqueo del pool de conexiones). Ver scripts/verify-whatsapp-concurrencia/README.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: npm ci
        run: npm ci

      - name: Confirmar initdb/pg_ctl/psql disponibles
        run: |
          if ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          # El paquete `postgresql` de Ubuntu/Debian deja initdb/pg_ctl fuera de PATH (ver el job fallback-savepoint-gate).
          if ! command -v initdb >/dev/null 2>&1; then
            PG_BIN="$(dirname "$(find /usr/lib/postgresql -maxdepth 3 -name initdb -print -quit)")"
            if [ -z "$PG_BIN" ] || [ "$PG_BIN" = "." ]; then
              echo "verify-whatsapp-concurrencia (CI): no se encontro initdb bajo /usr/lib/postgresql" >&2
              exit 1
            fi
            echo "$PG_BIN" >> "$GITHUB_PATH"
            export PATH="$PG_BIN:$PATH"
          fi
          initdb --version
          pg_ctl --version
          psql --version

      - name: scripts/verify-whatsapp-concurrencia/run.sh
        run: bash scripts/verify-whatsapp-concurrencia/run.sh

  citas-concurrencia-gate:
    name: Doble cita con 2+ conexiones simultaneas (scripts/verify-citas-concurrencia)
    runs-on: ubuntu-latest
    # Job APARTE (mismo servicio postgres que el gate de arriba): el runner generico run-gate.mjs ejecuta cada escenario de
    # assertions.sql en UNA conexion, y esta verificacion necesita varias conexiones SIMULTANEAS (C-17). scripts/verify-citas-
    # concurrencia/run.sh aplica las migraciones reales, dispara N conexiones con una "pistola de salida" (advisory lock) y comprueba
    # sobre las RPC reales de citas que el EXCLUDE y la idempotencia aguantan la carrera: exactamente una gana, nunca dos citas activas.
    # Sin assertions.sql a proposito: asi el auto-descubrimiento de run-gate.mjs no lo toma como un verify de una sola conexion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      VERIFY_USE_EXISTING_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: scripts/verify-citas-concurrencia/run.sh
        run: bash scripts/verify-citas-concurrencia/run.sh

  datos-empresa-concurrencia-gate:
    name: Decision de datos de empresa con 2 conexiones simultaneas (scripts/verify-licitaciones-aprobacion-datos-empresa/concurrencia.sh)
    runs-on: ubuntu-latest
    # Job APARTE (mismo servicio postgres que el gate de arriba): el runner generico run-gate.mjs ejecuta cada escenario de assertions.sql en UNA
    # conexion, y la transicion condicional de `licitaciones.decide_company_item` (migracion 036, WI-04) necesita DOS conexiones SIMULTANEAS: una
    # retiene la decision sin confirmar y se comprueba que la otra espera un Lock; despues, 10 rondas con "pistola de salida" -- exactamente un
    # ok y un conflict, una sola fila de bitacora. El concurrencia.sh vive junto a assertions.sql pero NO se llama run.sh, asi que el
    # auto-descubrimiento de run-gate.mjs sigue corriendo solo el assertions.sql de ese directorio.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      VERIFY_USE_EXISTING_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: scripts/verify-licitaciones-aprobacion-datos-empresa/concurrencia.sh
        run: bash scripts/verify-licitaciones-aprobacion-datos-empresa/concurrencia.sh

  stepup-concurrencia-gate:
    name: Consumo del step-up con 2 conexiones simultaneas (scripts/verify-licitaciones-stepup-y-bitacora/concurrencia.sh)
    runs-on: ubuntu-latest
    # Job APARTE (mismo servicio postgres que el gate de arriba): el consumo de un solo uso del step-up (`core.consume_step_up`, migracion 038) necesita
    # DOS conexiones SIMULTANEAS con el mismo jti: una retiene el consumo sin confirmar y se comprueba que la otra espera un Lock; despues, 10 rondas con
    # "pistola de salida": exactamente una pasa. El concurrencia.sh NO se llama run.sh, asi que run-gate.mjs solo corre el assertions.sql de ese directorio.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      VERIFY_USE_EXISTING_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: scripts/verify-licitaciones-stepup-y-bitacora/concurrencia.sh
        run: bash scripts/verify-licitaciones-stepup-y-bitacora/concurrencia.sh

  restaurantes-whatsapp-concurrencia-gate:
    name: WhatsApp y pedidos de restaurantes con 2+ conexiones simultaneas (scripts/verify-restaurantes-whatsapp-concurrencia)
    runs-on: ubuntu-latest
    # Job APARTE (mismo servicio postgres que el gate de arriba): el runner generico run-gate.mjs ejecuta cada escenario de
    # assertions.sql en UNA conexion y esta verificacion necesita varias conexiones SIMULTANEAS. scripts/verify-restaurantes-
    # whatsapp-concurrencia/run.sh aplica las migraciones reales, dispara N conexiones con una "pistola de salida" (advisory lock)
    # y comprueba sobre las RPC reales de restaurantes que la idempotencia de pedidos, el ledger de mensajes de Meta, el lease de
    # conversacion y el append atomico del historial aguantan la carrera. Sin assertions.sql a proposito (ver el README del script).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      VERIFY_USE_EXISTING_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: scripts/verify-restaurantes-whatsapp-concurrencia/run.sh
        run: bash scripts/verify-restaurantes-whatsapp-concurrencia/run.sh

  eval-copiloto-congelado:
    name: Arnes de evaluacion del Copiloto - respuestas esperadas congeladas vs Postgres sembrado (scripts/eval-copiloto)
    runs-on: ubuntu-latest
    # Job APARTE (mismo servicio postgres que el gate de arriba). Aplica las migraciones reales y las semillas del arnes
    # (scripts/eval-copiloto/seeds) y exige que `congelar.ts --check` reproduzca BYTE A BYTE scripts/eval-copiloto/datos/*.congelado.json:
    # las cifras esperadas de los 360 casos salen de ejecutar las herramientas de referencia, no de escribirlas a mano, y esto
    # falla si una migracion, una consulta del catalogo o una semilla cambian lo que esas herramientas devuelven (sin costo: no
    # llama a ningun modelo). La logica del arnes y el modelo guionado corren en `npm run test:unit` (apps/api/tests/eval-copiloto).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: npm ci
        run: npm ci

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Preparar la base (migraciones reales + semillas del arnes)
        run: bash scripts/eval-copiloto/preparar.sh atiende_eval_copiloto

      - name: Congelado vs base sembrada (--check)
        run: |
          export COPILOTO_EVAL_DATABASE_URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/atiende_eval_copiloto"
          npx vite-node scripts/eval-copiloto/congelar.ts -- --check

  rentas-concurrencia-gate:
    name: Concurrencia real de rentas con N conexiones (scripts/verify-rentas-concurrencia)
    runs-on: ubuntu-latest
    # Job APARTE (mismo servicio postgres que el gate de arriba), mismo patron que citas-concurrencia-gate: el runner generico run-gate.mjs
    # ejecuta cada escenario en UNA conexion y esta verificacion necesita N conexiones SIMULTANEAS (Rn-P3-12). run.sh aplica las
    # migraciones reales, dispara las conexiones con una "pistola de salida" (advisory lock) y comprueba: 30 reservas misma unidad/fechas
    # (1 gana, 0 deadlocks), back-to-back, statements concurrentes, claim/lease del lote iCal y aceptacion de invitaciones de staff.
    # Sin assertions.sql a proposito: asi el auto-descubrimiento de run-gate.mjs no lo toma como un verify de una sola conexion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      VERIFY_USE_EXISTING_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirmar cliente psql disponible
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Esperar a que el servicio Postgres acepte conexiones
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres nunca quedó listo" >&2
          exit 1

      - name: scripts/verify-rentas-concurrencia/run.sh
        run: bash scripts/verify-rentas-concurrencia/run.sh
