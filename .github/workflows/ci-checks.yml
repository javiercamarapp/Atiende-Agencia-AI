name: CI (typecheck, lint, tests, build)

# Qué es esto y por qué existe
# ------------------------------------------------------------------------------
# Hallazgo señalado por tres revisores independientes (19-sep-2026): el único
# workflow de este repo, .github/workflows/postgres-real-gate.yml, dice
# explícitamente en su propio comentario de cabecera y en
# .github/workflows/README.md que NO corre `npm run typecheck`, `npm run lint`
# ni `npx vitest run` — ese tier (repositorio en memoria) se corría solo a
# mano por quien hacía el cambio. Resultado real: un "test:unit en verde"
# reportado en un PR era solo la palabra de quien lo construyó, y dos guards
# que viven dentro de `npm run test:unit` (inventario de credenciales —
# apps/api/tests/env-inventory-guard.spec.ts, drift de documentación,
# workspaces sin código) nunca se ejecutaban en CI. IMPORTANTE — lo que este
# workflow NO cambia: el guard REAL de numeración/espejo de migraciones
# (`npm run verify:migration-versions` contra `supabase/migrations/` real) ya
# corría en CI desde antes de este PR, como paso propio de
# postgres-real-gate.yml (ver ese workflow). La spec
# packages/db/tests/migration-versions-guard.spec.ts que corre aquí dentro de
# test:unit NO es ese guard: solo prueba la lógica del checker
# (check-migration-versions.ts) contra árboles SINTÉTICOS en un directorio
# temporal — nunca lee `supabase/migrations/` real, así que no reemplaza ni
# duplica el paso del gate de Postgres.
#
# Qué SÍ cubre este workflow
# ------------------------------------------------------------------------------
# - `npm ci` (misma instalación reproducible que el gate de Postgres).
# - `npm run typecheck` (tsc del monorepo raíz + `--workspaces --if-present`,
#   que incluye el tsconfig propio de apps/web con jsx/Bundler).
# - `npm run lint` (ESLint flat config raíz, todo el árbol).
# - `npm run test:unit` (vitest run, la suite completa de *.spec.ts/.spec.tsx
#   listada en vitest.config.ts — incluye el inventario de credenciales
#   (apps/api/tests/env-inventory-guard.spec.ts) y el drift de documentación
#   (packages/db/tests/docs-migration-count-guard.spec.ts,
#   packages/db/tests/workspace-source-guard.spec.ts) que ya vivían como
#   specs sueltas dentro de esta misma suite, sin ningún trigger de CI). Este
#   comando NO activa el umbral de cobertura configurado en vitest.config.ts
#   (`coverage.thresholds`, del PR #144) — ese umbral no es una spec dentro
#   de test:unit, es config de vitest.config.ts que solo se evalúa cuando
#   algo corre instrumentado con `--coverage` (`npm run test:coverage`), y
#   ese comando sigue sin ningún trigger de CI tras este PR (queda igual de
#   sin correr que antes; ver docs/COBERTURA.md y el README raíz).
# - El build de producción de `apps/web` (`npm run build --workspace apps/web`
#   → `tsc --noEmit && vite build`), para que un build real roto (no solo el
#   typecheck raíz, que excluye apps/web a propósito — ver el comentario de
#   tsconfig.json) también falle el PR antes de llegar a Vercel.
#
# Qué NO cubre (fuera de alcance de este cambio puntual)
# ------------------------------------------------------------------------------
# - NO reemplaza ni toca .github/workflows/postgres-real-gate.yml (Postgres
#   real + RLS/GRANT) — ese sigue siendo su propio workflow, con su propio
#   servicio de Postgres. Mezclar ambos en un solo job encadenaría el tiempo
#   de instalar Postgres + aplicar 100+ migraciones detrás de typecheck/lint,
#   cuando hoy corren en paralelo.
# - NO hace build de apps/api ni apps/worker (no tienen paso de `build` propio
#   en package.json — son funciones/entry points de Node que Vercel invoca
#   directo con `tsx`/`node --experimental-strip-types`, no un bundle previo;
#   sí quedan cubiertos por `npm run typecheck`).
# - NO hace deploy ni toca Vercel/Supabase/ninguna configuración externa — es
#   exclusivamente de verificación.
#
# Por qué `paths` con negaciones y re-inclusiones, no `paths-ignore`
# ------------------------------------------------------------------------------
# Una lista `paths-ignore: [**/*.md, docs/**]` ingenua ignora TODO archivo .md
# sin importar dónde viva, y con eso burla dos de los guards de arriba en su
# escenario motivador exacto — un PR que solo toca docs/DEPLOY.md o
# supabase/migrations/README.md (docs-migration-count-guard) o que agrega un
# directorio bajo packages/* con SOLO un README.md (workspace-source-guard)
# matchea "**/*.md" y no dispara este workflow. Por eso: se excluye
# "**/*.md" y "docs/**" en general, pero se re-incluyen explícitamente
# docs/DEPLOY.md, supabase/migrations/README.md, y CUALQUIER cambio bajo
# apps/** o packages/** (README.md incluido) — el orden importa, GitHub
# Actions evalúa los patrones en secuencia y el último que matchea gana.
on:
  pull_request:
    # ready_for_review: al salir de borrador vuelve a correr la suite completa (en borrador se omite test:unit).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/DEPLOY.md"
      - "supabase/migrations/README.md"
      - "apps/**"
      - "packages/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "docs/DEPLOY.md"
      - "supabase/migrations/README.md"
      - "apps/**"
      - "packages/**"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress solo para pull_request: en push a main, cancelar la
  # corrida de un commit porque el siguiente merge ya llegó deja ese commit
  # de main sin veredicto propio (queda "cancelled" en vez de pass/fail).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Partido en dos jobs paralelos + un job agregador (ver .github/workflows/README.md,
# sección ci-checks.yml, con la medición de tiempos que lo justifica):
#   - estatico: typecheck + lint + trinquete + build de apps/web (~3 min medidos).
#   - unit: test:unit (~7.5-11 min medidos; es el cuello de botella).
#   - ci-checks: agregador que CONSERVA el nombre histórico del check
#     ("typecheck + lint + test:unit + build de apps/web") para que cualquier
#     protección de rama presente o futura que lo exija siga resolviendo.
jobs:
  estatico:
    name: typecheck + lint + build de apps/web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 + npm ci, o node_modules restaurado del cache de main (ver .github/actions/node-deps).
      - name: Node + dependencias
        uses: ./.github/actions/node-deps

      - name: Typecheck (raíz + --workspaces --if-present, incluye apps/web)
        run: npm run typecheck

      - name: Lint (ESLint, todo el árbol)
        run: npm run lint

      # PL-12: `lint` solo falla con errores; este paso falla si las ADVERTENCIAS superan el baseline versionado
      # (scripts/lint-ratchet/baseline.json). Segunda pasada de ESLint, solo lectura, sin red ni secretos.
      - name: Trinquete de lint (advertencias <= baseline)
        run: npm run lint:ratchet

      # i18n ES/EN: en lo ya migrado (scripts/i18n-guard/config.json, `alcance`) no entran textos visibles en espanol
      # escritos a mano; el alcance crece PR a PR (trinquete). Solo lectura, sin red ni secretos.
      - name: Trinquete i18n (sin textos en espanol a mano en lo migrado)
        run: npm run i18n:guard

      - name: Build de apps/web (Vite)
        run: npm run build --workspace apps/web

      # R-37: el JS por ruta no puede crecer sin que alguien lo decida en un PR.
      - name: Presupuesto de bundle (gzip por ruta)
        run: npm run verify:bundle-budget

  # test:unit partido en 3 shards de vitest (`--shard=i/3`): la suite completa ya
  # tardaba ~24-25 min en un solo job y chocaba con el timeout. Mismas pruebas, mismos
  # minutos totales; cada shard corre en paralelo (~8 min).
  unit-shard:
    name: test:unit (shard ${{ matrix.shard }}/3)
    # En PR en borrador no se corre la suite (~25 min de runner por push); typecheck/lint/build (`estatico`)
    # SI corren para dar retroalimentacion rapida. Al marcar el PR como listo (ready_for_review) corre todo.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 + npm ci, o node_modules restaurado del cache de main (ver .github/actions/node-deps).
      - name: Node + dependencias
        uses: ./.github/actions/node-deps

      - name: Tests unitarios (vitest run, repositorios en memoria)
        run: npm run test:unit -- --shard=${{ matrix.shard }}/3

  # Conserva el nombre histórico "test:unit" como check propio: pasa solo si
  # los 3 shards pasaron. if: always() para que un shard cancelado/fallido
  # produzca rojo y no un "skipped" (que cuenta como éxito).
  unit:
    name: test:unit
    needs: [unit-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Veredicto de los shards
        env:
          SHARDS: ${{ needs.unit-shard.result }}
          BORRADOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "unit-shard=$SHARDS borrador=$BORRADOR"
          # Unica excepcion: PR en borrador, donde los shards se omiten a proposito. Un borrador no se puede
          # fusionar, y al pasar a "listo" (ready_for_review) este workflow corre de nuevo con la suite completa.
          if [ "$BORRADOR" = "true" ] && [ "$SHARDS" = "skipped" ]; then
            echo "::notice::PR en borrador: test:unit se omite; corre al marcarlo como listo para revision"
            exit 0
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error::Algún shard de test:unit no terminó en success"
            exit 1
          fi

  # Agregador: mismo nombre que tenía el job único. if: always() para que un job
  # cancelado o fallido produzca un veredicto rojo en vez de quedar "skipped"
  # (un check "skipped" cuenta como exitoso para la protección de rama).
  ci-checks:
    name: typecheck + lint + test:unit + build de apps/web
    needs: [estatico, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Veredicto de los jobs
        env:
          ESTATICO: ${{ needs.estatico.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "estatico=$ESTATICO unit=$UNIT"
          if [ "$ESTATICO" != "success" ] || [ "$UNIT" != "success" ]; then
            echo "::error::Un job previo no terminó en success"
            exit 1
          fi
