name: E2E de navegador (Playwright, API simulada)

# Pruebas de navegador de apps/web contra el build estatico + el servidor de API simulada de
# apps/web/e2e/mock-api (loopback del runner). Sin secretos, sin base de datos, sin Supabase ni
# Vercel. NO es un check requerido y NO forma parte del agregador `ci-checks` de ci-checks.yml:
# informativo hasta medir la tasa de flake (docs/QA-E2E.md). Repo publico: Actions es gratis.
#
# Seguridad: solo `pull_request` (nunca `pull_request_target`) y `workflow_dispatch`; permisos de
# solo lectura; el checkout no persiste credenciales.
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (chromium, escritorio y movil)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Version de Playwright
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores de Playwright
        id: cache-pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}

      # Solo chromium. Con cache de navegador falta unicamente instalar las librerias del sistema.
      - name: Instalar chromium (sin cache)
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar dependencias del sistema (con cache)
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts construye apps/web (vite build) y levanta la API simulada y `vite preview`.
      - name: Pruebas E2E
        run: npm run test:e2e -- --workers=2

      - name: Subir reporte HTML y trazas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
