name: Secret scan (gitleaks)

# PL-11. Repo PUBLICO: un secreto que llega al historial queda expuesto aunque se borre despues, asi que
# este escaneo corre en cada PR y en cada push a main sobre el historial COMPLETO (fetch-depth: 0).
#
# Seguridad del workflow:
# - Disparadores: pull_request (NO pull_request_target), push a main y manual. En un PR desde un fork el
#   token es de solo lectura y no hay secretos; el codigo del PR nunca se ejecuta aqui (solo se lee).
# - permissions: contents: read. Sin secretos, sin despliegue, sin tocar Vercel/Supabase.
# - gitleaks se descarga de la release oficial FIJADA (version + sha256 verificado) en vez de usar una action
#   de terceros: sin licencia, sin dependencia de un tag movil. Para subir de version, cambiar GITLEAKS_VERSION
#   y GITLEAKS_SHA256 (el checksum sale de gitleaks_<version>_checksums.txt de la release).
# - Configuracion en .gitleaks.toml (reglas por defecto + una excepcion estrecha para fixtures de tests/).
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (version fijada, checksum verificado)
        run: |
          set -euo pipefail
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archivo" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archivo" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: "Escanear (--redact, el log nunca imprime el valor del hallazgo)"
        run: |
          # --log-opts HEAD: solo el historial alcanzable desde el commit que se prueba. Con fetch-depth: 0 el
          # checkout trae TODAS las ramas, y el default de gitleaks (--all) reportaria ramas ajenas al PR.
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts "HEAD" --redact --no-banner --verbose
