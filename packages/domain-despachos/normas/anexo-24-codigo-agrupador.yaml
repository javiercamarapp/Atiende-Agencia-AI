id: anexo-24-codigo-agrupador
tipo: norma
ordenamiento: "Anexo 24 de la RMF"
articulo_o_regla: "Código agrupador de cuentas (contabilidad electrónica 1.3)"
resumen: "Cada cuenta del catálogo electrónico declara un código agrupador de la lista cerrada del SAT (CodAgrup, obligatorio en el XSD CatalogoCuentas_1_3); las subcuentas declaran su cuenta padre (SubCtaDe). Lista en http://www.sat.gob.mx/esquemas/ContabilidadE/1_3/CatalogosParaEsqContE/CatalogosParaEsqContE.xsd."
fuente_url: "https://www.sat.gob.mx/minisitio/NormatividadRMFyRGCE/normatividad_rmf_rgce2026.html"
vigencia: "XSD 1.3 vigente a la fecha de descarga (7-oct-2026); el SAT puede actualizar la lista con una nueva versión del Anexo 24."
estado_verificacion: por_verificar
verificada_por: null
fecha: null
nota_verificacion: "La lista cerrada de 1080 códigos se copió de la enumeración c_CodAgrup del XSD oficial y una prueba la compara con el XSD vendorizado. Lo que NO está verificado es la correspondencia cuenta del catálogo base -> código: son propuestas que el fiscalista debe validar. Los clientes anteriores a la migración 028 quedan SIN código y el XML se niega a generarse hasta asignarlo."
usado_en_codigo:
